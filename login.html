<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPrintIndia - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container { 
            max-width: 400px; 
            width: 100%;
            margin: 0 auto; 
            padding: 30px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
        }
        #btn-main {
            background: #007bff; 
            color: white; 
            transition: background 0.2s;
        }
        #btn-main:hover { background: #0056b3; }
        .hidden { display: none; }
        
        /* Interactive feedback messages */
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="logged-out-view">
            <h2 id="auth-title">Welcome to ProPrintIndia</h2>
            <p id="auth-subtitle">Sign in to start enhancing images.</p>
            
            <input type="email" id="email" placeholder="Your Email">
            <input type="password" id="password" placeholder="Your Password">
            
            <button id="btn-main" onclick="handleAuth()">Log In</button>
            <div id="toggle-text" class="toggle-link" onclick="toggleMode()">Sign Up Instead</div>
            
            <div id="msg" class="status-msg hidden"></div>
        </div>

        <div id="logged-in-view" class="hidden">
            <h2>Welcome Back!</h2>
            <p>Logged in as: <strong id="user-email"></strong></p>
            <p>Your Trial Credits: <strong id="user-credits">0</strong></p>
            <button onclick="logout()" style="background: #dc3545; color: white; margin-top: 20px;">Log Out</button>
        </div>
    </div>

    <script>
        // Automatic Supabase Connection Setup
        const SUPABASE_URL = "https://mhqlqnsymvfkqedqmhqy.supabase.co";
        const SUPABASE_ANON_KEY = sb_publishable_KM7ZmFOyTgr36wSoL4t0SA_TlNGHPS6; // <-- Triple check this key starts with sb_publishable_
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUpMode = false;

        // Gracefully switches layouts when clicking the link
        function toggleMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const mainBtn = document.getElementById('btn-main');
            const toggleText = document.getElementById('toggle-text');
            const msg = document.getElementById('msg');
            
            msg.classList.add('hidden'); 

            if (isSignUpMode) {
                title.innerText = "Create an Account";
                subtitle.innerText = "Sign up to claim your 3 free trial credits.";
                mainBtn.innerText = "Sign Up";
                mainBtn.style.background = "#28a745";
                toggleText.innerText = "Already have an account? Log In Instead";
                toggleText.style.color = "#007bff";
            } else {
                title.innerText = "Welcome to ProPrintIndia";
                subtitle.innerText = "Sign in to start enhancing images.";
                mainBtn.innerText = "Log In";
                mainBtn.style.background = "#007bff";
                toggleText.innerText = "Sign Up Instead";
                toggleText.style.color = "#28a745";
            }
        }

        // Handles submitting credentials to your database with an explicit safety net
        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMsg("Please enter both an email and password.", "error");
                return;
            }

            showMsg("Processing authorization...", "success");

            try {
                if (isSignUpMode) {
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    if (error) {
                        showMsg(error.message, "error");
                    } else {
                        showMsg("Account created successfully! Check your email inbox for a verification link.", "success");
                    }
                } else {
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        showMsg(error.message, "error");
                    } else {
                        showMsg("Login successful!", "success");
                        checkUser();
                    }
                }
            } catch (err) {
                // This forces the script to print hidden browser/network errors directly on the screen
                showMsg("Connection Error: " + err.message, "error");
            }
        }

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.innerText = text;
            msg.className = "status-msg " + type;
            msg.classList.remove('hidden'); // Ensures the box visually unhides
        }

        // Automatically displays data if a user is already authenticated
        async function checkUser() {
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (user) {
                    document.getElementById('logged-out-view').classList.add('hidden');
                    document.getElementById('logged-in-view').classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;

                    // Grab credit count from your profiles table 
                    const { data: profile } = await _supabase
                        .from('profiles')
                        .select('credits')
                        .eq('id', user.id)
                        .single();

                    if (profile) {
                        document.getElementById('user-credits').innerText = profile.credits;
                    }
                }
            } catch (err) {
                console.error("Profile sync exception:", err);
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            document.getElementById('logged-out-view').classList.remove('hidden');
            document.getElementById('logged-in-view').classList.add('hidden');
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";
            document.getElementById('msg').classList.add('hidden');
            isSignUpMode = true;
            toggleMode();
        }

        // Check authentication state immediately on load
        checkUser();
    </script>
</body>
</html>
