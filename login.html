<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPrintIndia - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-container { 
            max-width: 400px; 
            width: 100%;
            margin: 0 auto; 
            padding: 30px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
        }
        #btn-main {
            background: #007bff; 
            color: white; 
            transition: background 0.2s;
        }
        #btn-main:hover { background: #0056b3; }
        .hidden { display: none; }
        
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-link:hover { text-decoration: underline; }

        /* Debug Logger Styling */
        .debug-box {
            margin-top: 20px;
            padding: 10px;
            background: #222;
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="logged-out-view">
            <h2 id="auth-title">Welcome to ProPrintIndia</h2>
            <p id="auth-subtitle">Sign in to start enhancing images.</p>
            
            <input type="email" id="email" placeholder="Your Email">
            <input type="password" id="password" placeholder="Your Password">
            
            <button id="btn-main" onclick="executeAuthAction()">Log In</button>
            <div id="toggle-text" class="toggle-link" onclick="handleFormToggle()">Sign Up Instead</div>
            
            <div id="msg" class="status-msg hidden"></div>
        </div>

        <div id="logged-in-view" class="hidden">
            <h2>Welcome Back!</h2>
            <p>Logged in as: <strong id="user-email"></strong></p>
            <p>Your Trial Credits: <strong id="user-credits">0</strong></p>
            <button onclick="executeLogout()" style="background: #dc3545; color: white; margin-top: 20px;">Log Out</button>
        </div>

        <div class="debug-box">
            <div><strong>System Status Logs:</strong></div>
            <div id="debug-logs">Initializing auth system...</div>
        </div>
    </div>

    <script>
        // 1. Core State
        var isSignUpMode = false;

        // 2. Database Connection Configuration (Automatically maps to your project)
        const SUPABASE_URL = "https://mhqlqnsymvfkqedqmhqy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KM7ZmFOyTgr36wSoL4t0SA_TlNGHPS6"; 
        
        let _supabase;

        function logDebug(message) {
            const container = document.getElementById('debug-logs');
            if (container) {
                container.innerHTML += `<br>⏱️ [${new Date().toLocaleTimeString()}] ${message}`;
                container.scrollTop = container.scrollHeight;
            }
            console.log(message);
        }

        try {
            if (typeof supabase !== 'undefined') {
                _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                logDebug("Supabase client built successfully.");
            } else {
                logDebug("CRITICAL: Supabase library script CDN didn't load.");
            }
        } catch (e) {
            logDebug("Initialization crash: " + e.message);
        }

        // 3. UI Toggle Logic
        function handleFormToggle() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const mainBtn = document.getElementById('btn-main');
            const toggleText = document.getElementById('toggle-text');
            const msg = document.getElementById('msg');
            
            if (msg) msg.classList.add('hidden'); 

            if (isSignUpMode) {
                logDebug("Switched form mode to: SIGN UP");
                if (title) title.innerText = "Create an Account";
                if (subtitle) subtitle.innerText = "Sign up to claim your 3 free trial credits.";
                if (mainBtn) {
                    mainBtn.innerText = "Sign Up";
                    mainBtn.style.background = "#28a745";
                }
                if (toggleText) {
                    toggleText.innerText = "Already have an account? Log In Instead";
                    toggleText.style.color = "#007bff";
                }
            } else {
                logDebug("Switched form mode to: LOG IN");
                if (title) title.innerText = "Welcome to ProPrintIndia";
                if (subtitle) subtitle.innerText = "Sign in to start enhancing images.";
                if (mainBtn) {
                    mainBtn.innerText = "Log In";
                    mainBtn.style.background = "#007bff";
                }
                if (toggleText) {
                    toggleText.innerText = "Sign Up Instead";
                    toggleText.style.color = "#28a745";
                }
            }
        }

        // 4. Central Form Submission Engine
        async function executeAuthAction() {
            const emailEl = document.getElementById('email');
            const passwordEl = document.getElementById('password');
            
            if (!emailEl || !passwordEl) return;

            const email = emailEl.value.trim();
            const password = passwordEl.value;
            
            if (!email || !password) {
                displayStatus("Please enter both an email and password.", "error");
                logDebug("Validation rejected: Missing fields.");
                return;
            }

            displayStatus("Processing request...", "success");
            logDebug(`Connecting to server endpoints for mode [${isSignUpMode ? 'SIGNUP' : 'LOGIN'}]...`);

            if (!_supabase) {
                displayStatus("Connection Error: Supabase core library failed to load.", "error");
                logDebug("Submission aborted: _supabase object missing.");
                return;
            }

            if (SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
                displayStatus("Configuration Error: API Key missing.", "error");
                logDebug("ERROR: You have not replaced the key placeholder with your actual key yet.");
                return;
            }

            try {
                if (isSignUpMode) {
                    logDebug("Awaiting cloud registration callback...");
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    
                    if (error) {
                        logDebug("Cloud rejected request: " + error.message);
                        displayStatus(error.message, "error");
                    } else {
                        logDebug("Cloud transaction finalized successfully!");
                        displayStatus("Account created! Check your email inbox for a verification link.", "success");
                    }
                } else {
                    logDebug("Awaiting cloud credentials verification...");
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) {
                        logDebug("Cloud login rejected: " + error.message);
                        displayStatus(error.message, "error");
                    } else {
                        logDebug("Cloud login validation verified successfully.");
                        displayStatus("Login successful!", "success");
                        syncUserSession();
                    }
                }
            } catch (err) {
                logDebug("Fatal browser network crash: " + err.message);
                displayStatus("Network Connection Error: " + err.message, "error");
            }
        }

        function displayStatus(text, type) {
            const msg = document.getElementById('msg');
            if (msg) {
                msg.innerText = text;
                msg.className = "status-msg " + type;
                msg.classList.remove('hidden');
            }
        }

        // 5. Session Management
        async function syncUserSession() {
            if (!_supabase) return;
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (user) {
                    logDebug("User session active: " + user.email);
                    if (document.getElementById('logged-out-view')) document.getElementById('logged-out-view').classList.add('hidden');
                    if (document.getElementById('logged-in-view')) document.getElementById('logged-in-view').classList.remove('hidden');
                    if (document.getElementById('user-email')) document.getElementById('user-email').innerText = user.email;

                    const { data: profile } = await _supabase
                        .from('profiles')
                        .select('credits')
                        .eq('id', user.id)
                        .single();

                    if (profile && document.getElementById('user-credits')) {
                        document.getElementById('user-credits').innerText = profile.credits;
                    }
                }
            } catch (err) {
                logDebug("Profile row matching exception: " + err.message);
            }
        }

        async function executeLogout() {
            if (_supabase) await _supabase.auth.signOut();
            logDebug("Session cleared. User logged out.");
            if (document.getElementById('logged-out-view')) document.getElementById('logged-out-view').classList.remove('hidden');
            if (document.getElementById('logged-in-view')) document.getElementById('logged-in-view').classList.add('hidden');
            if (document.getElementById('email')) document.getElementById('email').value = "";
            if (document.getElementById('password')) document.getElementById('password').value = "";
            if (document.getElementById('msg')) document.getElementById('msg').classList.add('hidden');
            
            isSignUpMode = true;
            handleFormToggle();
        }

        if (typeof supabase !== 'undefined') {
            syncUserSession();
        }
    </script>
</body>
</html>
