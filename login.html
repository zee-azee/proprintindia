<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPrintIndia - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-container { 
            max-width: 400px; 
            width: 100%;
            margin: 0 auto; 
            padding: 30px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
        }
        #btn-main {
            background: #007bff; 
            color: white; 
            transition: background 0.2s;
        }
        #btn-main:hover { background: #0056b3; }
        .hidden { display: none; }
        
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="auth-view">
            <h2 id="auth-title">Welcome to ProPrintIndia</h2>
            <p id="auth-subtitle">Sign in to start enhancing images.</p>
            
            <input type="email" id="email" placeholder="Your Email">
            <input type="password" id="password" placeholder="Your Password">
            
            <button id="btn-main" onclick="executeAuthAction()">Log In</button>
            <div id="toggle-text" class="toggle-link" onclick="handleFormToggle()">Sign Up Instead</div>
            
            <div id="msg" class="status-msg hidden"></div>
        </div>
    </div>

    <script>
        // 1. Core Configuration
        var isSignUpMode = false;
        const SUPABASE_URL = "https://mhqlqnsymvfkqedqmhqy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KM7ZmFOyTgr36wSoL4t0SA_TlNGHPS6"; 
        
        let _supabase;

        try {
            if (typeof supabase !== 'undefined') {
                _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Initialization error:", e);
        }

        // 2. UI Toggle Logic
        function handleFormToggle() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const mainBtn = document.getElementById('btn-main');
            const toggleText = document.getElementById('toggle-text');
            const msg = document.getElementById('msg');
            
            if (msg) msg.classList.add('hidden'); 

            if (isSignUpMode) {
                if (title) title.innerText = "Create an Account";
                if (subtitle) subtitle.innerText = "Sign up to claim your 3 free trial credits.";
                if (mainBtn) {
                    mainBtn.innerText = "Sign Up";
                    mainBtn.style.background = "#28a745";
                }
                if (toggleText) {
                    toggleText.innerText = "Already have an account? Log In Instead";
                    toggleText.style.color = "#007bff";
                }
            } else {
                if (title) title.innerText = "Welcome to ProPrintIndia";
                if (subtitle) subtitle.innerText = "Sign in to start enhancing images.";
                if (mainBtn) {
                    mainBtn.innerText = "Log In";
                    mainBtn.style.background = "#007bff";
                }
                if (toggleText) {
                    toggleText.innerText = "Sign Up Instead";
                    toggleText.style.color = "#28a745";
                }
            }
        }

        // 3. Form Submission
        async function executeAuthAction() {
            const emailEl = document.getElementById('email');
            const passwordEl = document.getElementById('password');
            if (!emailEl || !passwordEl) return;

            const email = emailEl.value.trim();
            const password = passwordEl.value;
            
            if (!email || !password) {
                displayStatus("Please enter both an email and password.", "error");
                return;
            }

            displayStatus("Processing request...", "success");

            if (!_supabase) {
                displayStatus("Connection Error: Cloud library failed to load.", "error");
                return;
            }

            try {
                if (isSignUpMode) {
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    if (error) {
                        displayStatus(error.message, "error");
                    } else {
                        displayStatus("Account created successfully! Logging you in...", "success");
                        // Automatically sign them in right after signing up
                        await _supabase.auth.signInWithPassword({ email, password });
                        window.location.href = 'index.html';
                    }
                } else {
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        displayStatus(error.message, "error");
                    } else {
                        displayStatus("Login successful! Redirecting...", "success");
                        window.location.href = 'index.html';
                    }
                }
            } catch (err) {
                displayStatus("Network Connection Error: " + err.message, "error");
            }
        }

        function displayStatus(text, type) {
            const msg = document.getElementById('msg');
            if (msg) {
                msg.innerText = text;
                msg.className = "status-msg " + type;
                msg.classList.remove('hidden');
            }
        }

        // 4. Active Session Guard (Redirects if already logged in)
        async function checkActiveSession() {
            if (!_supabase) return;
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (user) {
                    // User is already logged in, send them straight home
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.log("Session verification error:", err.message);
            }
        }

        if (typeof -supabase !== 'undefined') {
            checkActiveSession();
        }
    </script>
</body>
</html>
